plugins {
    id 'com.android.application'
}

android {
    namespace 'com.todolife.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.todolife.app"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "1.2.7"
        resourceConfigurations += ["zh", "en"]
    }

    buildTypes {
        // 两个构建类型都用 debug 证书 + v1(JAR) 与 v2 双签名：
        // minSdk 24 的手机实际按 v2 校验，APK 内同时保留 v1 的
        // META-INF/CERT.SF、CERT.RSA，兼容对 v2-only 包挑剔的机型与三方安装器。
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
            signingConfig.enableV1Signing = true
            signingConfig.enableV2Signing = true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            signingConfig.enableV1Signing = true
            signingConfig.enableV2Signing = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.core:core:1.12.0'
}
